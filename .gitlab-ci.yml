image: espressif/idf:v5.5

workflow:
  rules:
    - if: >
        ($CI_PIPELINE_SOURCE == "merge_request_event") && 
        ($CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "main" || 
         $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "develop")
    - if: '$CI_COMMIT_TAG'

stages:
  - setup
  - build:firmware
  - build:examples
  - build:docs
  - deploy

setup:
  stage: setup
  script:
    - rm -rf .oi/
    - mkdir -p .oi/bin/oi-firmware-$(cat version.txt)
    - mkdir -p .oi/docs/
    - mkdir -p .oi/lib/
  tags:
    - oi-firmware

.build:bin:
  stage: build:firmware
  needs:
    - job: setup
  script:
    - cp sdkconfig.ci.defaults.${MODULE_TYPE} sdkconfig
    - idf.py reconfigure
    - idf.py build
    - mkdir -p .oi/bin/oi-firmware-$(cat version.txt)
    - cp build/OI-Firmware.bin .oi/bin/oi-firmware-$(cat version.txt)/${MODULE_TYPE}_firmware-$(cat version.txt).bin
    - cp build/ota_data_initial.bin .oi/bin/oi-firmware-$(cat version.txt)/${MODULE_TYPE}_ota_data_initial-$(cat version.txt).bin
    - cp build/bootloader/bootloader.bin .oi/bin/oi-firmware-$(cat version.txt)/${MODULE_TYPE}_bootloader-$(cat version.txt).bin
    - cp build/partition_table/partition-table.bin .oi/bin/oi-firmware-$(cat version.txt)/${MODULE_TYPE}_partitions-$(cat version.txt).bin
  artifacts:
    paths:
      - .oi/bin/
    expire_in: 1 week
  tags:
    - oi-firmware

build:bin:core:
  extends: .build:bin
  variables:
    MODULE_TYPE: "core"

build:bin:discrete:
  extends: .build:bin
  variables:
    MODULE_TYPE: "discrete"

build:bin:discreteve:
  extends: .build:bin
  variables:
    MODULE_TYPE: "discreteve"

build:bin:stepper:
  extends: .build:bin
  variables:
    MODULE_TYPE: "stepper"

build:bin:mixed:
  extends: .build:bin
  variables:
    MODULE_TYPE: "mixed"

build:bin:relayhp:
  extends: .build:bin
  variables:
    MODULE_TYPE: "relayhp"

build:bin:relaylp:
  extends: .build:bin
  variables:
    MODULE_TYPE: "relaylp"

build:bin:analogls:
  extends: .build:bin
  variables:
    MODULE_TYPE: "analogls"

build:bin:dc:
  extends: .build:bin
  variables:
    MODULE_TYPE: "dc"

build:examples:library:
  stage: build:examples
  needs:
    - job: setup
  script:
    - ./build_examples.sh components/openindus/examples/
  after_script:
    - git restore main/main.cpp
  tags:
    - oi-firmware

build:examples:docs:
  stage: build:examples
  needs:
    - job: setup
  script:
    - ./build_examples.sh docs/examples/
  after_script:
    - git restore main/main.cpp
  tags:
    - oi-firmware

build:docs:
  stage: build:docs
  needs:
    - job: setup
  before_script:
    - apt update
    - apt install -y doxygen
    - pip3 install -r docs/requirements.txt
  script:
    - cd docs
    - doxygen doxygen/Doxyfile
    - ./build_multiversion.sh "$CI_COMMIT_TAG"
    - cd ..
    - mkdir -p .oi/docs
    - cp -r docs/build/html/. .oi/docs/
  artifacts:
    paths:
      - .oi/docs/
    expire_in: 1 week
  tags:
    - oi-firmware

# Publication sur openindus.com par SSH (variables PROD_*, tags v* protégés).

.deploy:ssh:
  stage: deploy
  rules:
    - if: $CI_COMMIT_TAG
  before_script:
    - ': "${PROD_SSH_HOST:?}" "${PROD_SSH_USER:?}" "${PROD_SSH_KEY:?}" "${PROD_SSH_KNOWN_HOSTS:?}" "${PROD_CONTENT_PATH:?}"'
    - apt-get update -qq && apt-get install -y -qq rsync openssh-client >/dev/null
    - mkdir -p ~/.ssh && printf '%s\n' "$PROD_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts && chmod 600 "$PROD_SSH_KEY"
    - export RSYNC_RSH="ssh -i $PROD_SSH_KEY -p ${PROD_SSH_PORT:-22} -o BatchMode=yes"
    - export TARGET="$PROD_SSH_USER@$PROD_SSH_HOST:$PROD_CONTENT_PATH"
  tags:
    - oi-firmware

deploy:bin:
  extends: .deploy:ssh
  needs:
    - job: build:bin:core
    - job: build:bin:discrete
    - job: build:bin:discreteve
    - job: build:bin:stepper
    - job: build:bin:mixed
    - job: build:bin:relayhp
    - job: build:bin:relaylp
    - job: build:bin:analogls
    - job: build:bin:dc
  script:
    - n=$(find .oi/bin -name '*.bin' | wc -l); echo "$n binaires"
    - 'test "$n" -eq 36 || { echo "36 binaires attendus (9 modules x 4), $n trouvés"; exit 1; }'
    - rsync -rz --chmod=D2775,F664 --itemize-changes .oi/bin/ "$TARGET/bin/"

deploy:library:
  extends: .deploy:ssh
  needs:
    - job: build:bin:core
      artifacts: false
    - job: build:bin:discrete
      artifacts: false
    - job: build:bin:discreteve
      artifacts: false
    - job: build:bin:stepper
      artifacts: false
    - job: build:bin:mixed
      artifacts: false
    - job: build:bin:relayhp
      artifacts: false
    - job: build:bin:relaylp
      artifacts: false
    - job: build:bin:analogls
      artifacts: false
    - job: build:bin:dc
      artifacts: false
    - job: build:examples:library
      artifacts: false
  script:
    - mkdir -p .oi/lib
    - tar -czf .oi/lib/openindus-$(cat version.txt).tar.gz -C components/openindus .
    - tar -czf .oi/lib/arduino-esp32-$(cat version.txt).tar.gz -C components/arduino .
    - rsync -rz --chmod=D2775,F664 --itemize-changes .oi/lib/ "$TARGET/lib/"

deploy:docs:
  extends: .deploy:ssh
  needs:
    - job: build:docs
    - job: build:examples:docs
      artifacts: false
  script:
    - rsync -rz --update --chmod=D2775,F664 .oi/docs/ "$TARGET/doc/"